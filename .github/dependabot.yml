# Keeps CI actions and development tools fresh. The vendored runtime packages in
# src/pg_explorer_mcp/_vendor are updated by hand, as src/pg_explorer_mcp/_vendor/README.md describes:
# a pip entry here would only bump their requirements.txt, and scripts/check_vendor.py
# would fail that pull request. Dependabot alerts cover them all the same: the
# dependency graph reads that requirements.txt without any entry in this file.
# Dependabot reads this file from the default branch, main, which holds releases;
# its pull requests go to develop, like every other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # init and analyze must be of one version: a pull request that bumps either alone fails CodeQL.
      codeql-action:
        patterns: ["github/codeql-action"]
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        patterns: ["*"]
    ignore:
      # From mypy 1.20, pytest 9, hypothesis 6.142 and pytest-randomly 4.1 on, they need Python 3.10,
      # and pg-explorer-mcp still supports 3.9 (ADR 0003): uv cannot resolve them for the 3.9 branch
      # of uv.lock, so Dependabot would fail. Their versions for newer Pythons move by hand,
      # `uv lock --upgrade-package`, which keeps every branch resolvable.
      - dependency-name: mypy
        versions: [">=1.20"]
      - dependency-name: pytest
        versions: [">=9"]
      - dependency-name: hypothesis
        versions: [">=6.142"]
      - dependency-name: pytest-randomly
        versions: [">=4.1"]
