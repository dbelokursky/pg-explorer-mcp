name: tests

# A pull request gets the checks that catch real mistakes in a few minutes: no macOS (its runners
# queue for long, and GitHub cancels them when there are none) and three PostgreSQL versions instead
# of six. A push to develop or main runs the whole set, and so does the night run on develop: a merge
# that auto-merge made with the workflow's own token starts no push run. Windows stays in both: most
# users run it, and it has caught code pages and a login refusal that Linux never shows.
#
# GitHub takes the schedule, and workflow_dispatch, from the default branch, main: the night run
# checks out develop itself, and it starts once a release has brought this file to main.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'night' || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff, mypy, vendor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run python scripts/check_vendor.py

  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name != 'pull_request' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  client:
    # A real MCP client, Qwen Code (the open-source base of GigaCode CLI), without a model:
    # it must reach the server that install.py registered and see the extension.
    name: real client (Qwen Code)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QWEN_CODE_VERSION: "0.25.2"
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: npm install --global --no-audit --no-fund "@qwen-code/qwen-code@${QWEN_CODE_VERSION}"
      - run: python3 scripts/client_smoke.py --qwen "$(command -v qwen)"

  windows-integration:
    # Most users run Windows: the password file under %APPDATA%, the system code page of pipes and
    # the runner's own PostgreSQL 17, which the image ships stopped, with the password "root".
    name: integration (Windows, PostgreSQL 17)
    runs-on: windows-latest
    env:
      PG_EXPLORER_MCP_IT: "1"
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: pg_mcp_it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - name: start PostgreSQL, keep its password where libpq looks on Windows
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          New-Item -ItemType Directory -Force "$env:APPDATA\postgresql" | Out-Null
          Set-Content -Encoding ascii -Path "$env:APPDATA\postgresql\pgpass.conf" -Value "localhost:5432:*:postgres:root"
          Add-Content -Path $env:GITHUB_PATH -Value $env:PGBIN
          # The cluster's default encoding may be WIN1252; the tests need UTF-8 for their Cyrillic names.
          & "$env:PGBIN\psql.exe" -X -d postgres -c "CREATE DATABASE pg_mcp_it TEMPLATE template0 ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C'"
      - run: uv sync --locked
      - run: uv run pytest -m integration
      - name: install.py through a pipe, the way an agent runs it
        shell: pwsh
        run: |
          uv run python install.py --check --lang ru | Out-String
          exit $LASTEXITCODE

  integration:
    name: integration (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 13 is past its end of life but still runs in many companies; coverage is measured on 16.
        # A pull request takes the oldest, the newest and 16; the whole set takes them all.
        postgres: ${{ github.event_name != 'pull_request' && fromJSON('["13", "14", "15", "16", "17", "18"]') || fromJSON('["13", "16", "18"]') }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_EXPLORER_MCP_IT: "1"
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pgbouncer, for the tests through a pooler in transaction mode
        run: sudo apt-get install -y --no-install-recommends pgbouncer
      - name: all tests with coverage
        if: matrix.postgres == '16'
        run: uv run pytest --cov --cov-report=term-missing
      - name: integration tests
        if: matrix.postgres != '16'
        run: uv run pytest -m integration

  pgadmin:
    # What install.py export pgadmin writes, loaded by pgAdmin itself on its first start and read
    # back: every field of the export has to come back as written, under its own server. The Python
    # is scripts/pgadmin_check.py, not this file: the night run takes the workflow from main and the
    # code from develop, so a line here naming the package would break when develop renames it.
    name: export to pgAdmin
    runs-on: ubuntu-latest
    env:
      PGADMIN_IMAGE: dpage/pgadmin4:9.18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: servers.json as the export writes it
        run: |
          uv run python scripts/pgadmin_check.py write servers.json /var/lib/pgadmin/pgpass
          chmod 644 servers.json
      - name: pgAdmin loads it, then dumps what it holds
        run: |
          docker run -d --name pgadmin -e PGADMIN_DEFAULT_EMAIL=ci@example.com -e PGADMIN_DEFAULT_PASSWORD=ci-only \
            -e PGADMIN_SERVER_JSON_FILE=/servers.json -v "$PWD/servers.json:/servers.json:ro" "$PGADMIN_IMAGE"
          for attempt in $(seq 120); do docker logs pgadmin 2>&1 | grep -q "Listening at" && break; sleep 2; done
          docker logs pgadmin 2>&1 | grep "Added 2 Server Group(s) and 3 Server(s)."
          docker exec pgadmin /venv/bin/python3 /pgadmin4/setup.py dump-servers /tmp/dumped.json --user ci@example.com
          docker exec pgadmin cat /tmp/dumped.json > dumped.json
      - name: every field comes back as the export wrote it
        run: python3 scripts/pgadmin_check.py compare servers.json dumped.json
